# 随机端口，避免本地多实例冲突；验证时从启动日志或测试中获取端口
server.port=0
spring.main.banner-mode=off

# ===== 本地审计服务配置（全部指向本机文件，不接外网/数据库）=====
# 默认本地漏洞库 JSON 的绝对或相对路径；也可在每次请求中用 vulnLibraryPath 指定
audit.vuln-library-path=samples/vuln-db.json
# 历史扫描保留条数（有界，防止多次大清单扫描累积导致内存增长）
audit.history-limit=10
# 每处理多少个依赖条目执行一次取消检查点（大清单下取消延迟与吞吐的平衡）
audit.cancel-batch-size=256
# 取消时等待执行线程产出终态的最大毫秒数，保证取消返回后不留半成品
audit.cancel-await-millis=10000
# 单次扫描快照保留的组件明细上限（findings/issues 始终完整；0 或负数表示不限）
audit.max-components-in-snapshot=100000
